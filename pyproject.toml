[project]
name = "neural-pong"
dynamic = ["version"]
description = "World model for Pong game"
requires-python = ">=3.10"
dependencies = [
    "jsonargparse>=4.50.0",
    "torch>=2.0.0",
    "gymnasium[atari]>=0.29.0",
    "tensorboard>=2.15.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "torchvision>=0.15.0",
    "ale-py>=0.4.0",
    "tqdm>=4.66.0",
    "imageio>=2.31.0",
]
readme = "README.md"
license = "MIT"

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project.scripts]
neural-pong = "neural_pong.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.8.0",
    "pytest>=8.3.2",
]

[tool.setuptools.dynamic]
version = {attr = "neural_pong.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RET", "RUF", "SIM", "UP"]
